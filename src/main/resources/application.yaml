spring:
    application:
        name: spring-practice-aws-s3

    threads:
        virtual:
            enabled: true


storage:
    s3:
        access-key: ${S3_ACCESS_KEY}
        secret-key: ${S3_SECRET_KEY}
        region: ${S3_REGION}
        endpoint: ${S3_ENDPOINT}
        path-style-access-enabled: ${S3_PATH_STYLE_ACCESS}
